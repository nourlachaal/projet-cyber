# Honeypots live on an INTERNAL network: no internet, no published ports.
x-honeypot: &honeypot
  build: .
  environment:
    HP_LOG_PATH: /app/data/events.jsonl
    HP_BIND_HOST: 0.0.0.0
  volumes:
    - ./data:/app/data
  networks: [lab]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 256m
  pids_limit: 128

services:
  http-hp:
    <<: *honeypot
    command: python -m honeypots.http_hp.server

  attacker:
    build: .
    profiles: [attacker]
    volumes:
      - ./scenarios:/app/scenarios:ro
    networks: [lab]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive      # lab only
      POSTGRES_DB: hive
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [db]

volumes:
  pgdata:

networks:
  lab:
    internal: true
  db: {}