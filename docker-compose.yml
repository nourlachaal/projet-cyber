
services:
  http-hp:
    build: .
    command: python -m honeypots.http_hp.server
    environment:
      HP_LOG_PATH: /app/data/events.jsonl
    volumes:
      - ./data:/app/data
    networks:
      - lab

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lab

  backend:
    build: .
    command: python -m uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lab

networks:
  lab:
    internal: true

volumes:
  redis_data:
